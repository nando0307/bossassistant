[project]
name = "app"
version = "0.1.0"
description = "BossAssistant: department-scoped RAG assistant (HR + Finance) with LangGraph routing"
readme = "README.md"
authors = [
    { name = "nando", email = "lenando0307@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-neo4j>=0.9.0",
    "langchain-nvidia-ai-endpoints>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.6.1",
    "langgraph>=1.1.9",
    "neo4j>=6.1.0",
    "numpy>=2.4.6",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.10",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.45.0",
]

[project.optional-dependencies]
# Cross-encoder reranking pulls torch and transformers - roughly 470MB installed,
# plus a ~1.5GB model download on first use. It only runs in deep mode with
# ENABLE_RERANKER=true, which is off by default, so the serving image should not
# carry it. Install with: uv sync --extra rerank
rerank = [
    "sentence-transformers>=5.5.0",
]


[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    # Present in dev so type checking and tests see the real CrossEncoder.
    "sentence-transformers>=5.5.0",
    "pytest>=9.0.3",
    "ragas>=0.2",
    "ruff>=0.15.11",
]
